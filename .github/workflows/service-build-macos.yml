name: Core service - macOS single-executable build

# Builds packages/service into one standalone storycore-service-macos
# binary (no Node.js install needed on the target machine) for macOS,
# smoke-tests it the same two ways the Windows/Linux builds already do
# (explicit CORE_DB_PATH, and the zero-config default path - ~/.storycore,
# the same non-Windows branch of server.mjs's defaultDbPath() Linux
# already uses, since that check is a plain `!== 'win32'`, not Linux-
# specific) and - on push to main - publishes it to the SAME GitHub
# Release tag the Windows/Linux builds use (storycore-service-v<version>).
#
# Couldn't be built-and-verified in this project's own Linux dev sandbox
# the way the Linux build was - Node's SEA packaging copies the current
# platform's own node binary as its base (build-exe.mjs's `copyFileSync
# (process.execPath, exe)`), so producing a macOS binary needs an actual
# macOS machine, not just a different --target flag. This leans on
# macos-latest for real verification, same trust model already applied to
# the Windows build.
#
# Unsigned/unnotarized build - no Apple Developer ID budgeted yet. macOS
# Gatekeeper refuses to run an unsigned, unnotarized binary downloaded
# from a browser at all (not just a warning, unlike Windows SmartScreen)
# until it's un-quarantined - see installer-macos/install.sh, which
# strips the quarantine attribute itself since curl (not a browser) is
# what actually fetches the binary there.

on:
  push:
    branches: [main]
    paths:
      - "packages/service/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/service-build-macos.yml"
  pull_request:
    paths:
      - "packages/service/**"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies (root + service workspace)
        run: npm ci
      - name: Run the service's own test suite
        run: npm run test --workspace=@ocedo-apps/storycore-service
      - name: Build the single-executable Core service
        working-directory: packages/service
        run: node build-exe.mjs
      - name: Smoke-test the built binary (explicit CORE_DB_PATH)
        run: |
          set -euo pipefail
          db_dir="$RUNNER_TEMP/core-smoke-explicit"
          mkdir -p "$db_dir"
          export CORE_DB_PATH="$db_dir/core.db"
          export CORE_PORT=43199
          packages/service/dist/storycore-service &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=false
          for i in $(seq 1 20); do
            sleep 0.5
            if curl -fsS "http://127.0.0.1:43199/admin" > /dev/null 2>&1; then ok=true; break; fi
          done
          if [ "$ok" != "true" ]; then echo "Core service did not respond on /admin"; exit 1; fi
          bootstrap_path="${CORE_DB_PATH}.bootstrap.json"
          if [ ! -f "$bootstrap_path" ]; then echo "Bootstrap credentials file was not written"; exit 1; fi
          for key in storybook sandbox comic admin; do
            value=$(node -e "const v=JSON.parse(require('fs').readFileSync('$bootstrap_path','utf8'))['$key']??''; process.stdout.write(v)")
            if ! [[ "$value" =~ ^[0-9a-f]{64}$ ]]; then echo "Missing or malformed '$key' credential"; exit 1; fi
          done
          echo "Smoke test passed: service responded and auto-provisioned all credentials."
      - name: Smoke-test the zero-config default database path
        run: |
          set -euo pipefail
          unset CORE_DB_PATH
          export HOME="$RUNNER_TEMP/core-smoke-default-home"
          mkdir -p "$HOME"
          export CORE_PORT=43200
          packages/service/dist/storycore-service &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=false
          for i in $(seq 1 20); do
            sleep 0.5
            if curl -fsS "http://127.0.0.1:43200/admin" > /dev/null 2>&1; then ok=true; break; fi
          done
          if [ "$ok" != "true" ]; then echo "Core service did not respond on /admin with the default database path"; exit 1; fi
          default_db="$HOME/.storycore/core.db"
          if [ ! -f "$default_db" ]; then echo "Default database was not created at $default_db"; exit 1; fi
          echo "Zero-config smoke test passed: service created its own database at $default_db."
      - name: Upload the built executable (workflow artifact)
        uses: actions/upload-artifact@v4
        with:
          name: storycore-service-macos
          path: packages/service/dist/storycore-service
          if-no-files-found: error
      - name: Read service version
        if: github.event_name == 'push'
        id: version
        run: echo "version=$(node -p "require('./packages/service/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Copy binary under a platform-specific filename
        if: github.event_name == 'push'
        run: cp packages/service/dist/storycore-service packages/service/dist/storycore-service-macos
      # Uploaded as storycore-service-macos - an installer fetches this
      # exact filename via GitHub's stable
      # ".../releases/latest/download/storycore-service-macos" pattern.
      - name: Publish GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: storycore-service-v${{ steps.version.outputs.version }}
          name: kaampi Codex service v${{ steps.version.outputs.version }}
          body: Standalone build of the Core service (packages/service), published per platform as each platform's build completes - Windows, Linux, and macOS binaries. Unsigned; Windows SmartScreen will warn on first run for the .exe, and macOS Gatekeeper will refuse to open the binary from a plain double-click until it's un-quarantined (see README).
          files: packages/service/dist/storycore-service-macos
          fail_on_unmatched_files: true
