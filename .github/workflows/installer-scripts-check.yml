name: kaampi Codex installer (Linux, macOS) - lint

# installer-linux/install.sh and installer-macos/install.sh are used
# directly (curl | bash from the README, or downloaded and run by hand) -
# unlike the Windows installer, there's nothing to compile, so unlike
# installer-build.yml there's no release artifact to publish here. This
# just catches script regressions (syntax errors, common shell pitfalls)
# before they reach main, since a broken install.sh would otherwise only
# surface when someone's install fails on their own machine. One shared
# job for both - launchctl/xattr calls in the macOS script aren't
# available to actually run here, but bash -n and shellcheck both work on
# the script's text regardless of which OS it targets at runtime.

on:
  push:
    branches: [main]
    paths:
      - "installer-linux/**"
      - "installer-macos/**"
      - ".github/workflows/installer-scripts-check.yml"
  pull_request:
    paths:
      - "installer-linux/**"
      - "installer-macos/**"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: |
          bash -n installer-linux/install.sh
          bash -n installer-macos/install.sh
      - name: ShellCheck (Linux installer)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: installer-linux
      - name: ShellCheck (macOS installer)
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: installer-macos
