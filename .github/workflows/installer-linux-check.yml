name: kaampi Codex installer (Linux) - lint

# installer-linux/install.sh is used directly (curl | bash from the
# README, or downloaded and run by hand) - unlike the Windows installer,
# there's nothing to compile, so unlike installer-build.yml there's no
# release artifact to publish here. This just catches script regressions
# (syntax errors, common shell pitfalls) before they reach main, since a
# broken install.sh would otherwise only surface when someone's install
# fails on their own machine.

on:
  push:
    branches: [main]
    paths:
      - "installer-linux/**"
      - ".github/workflows/installer-linux-check.yml"
  pull_request:
    paths:
      - "installer-linux/**"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check
        run: bash -n installer-linux/install.sh
      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: installer-linux
