name: StoryCore installer (Windows)

# Compiles installer/storycore-installer.iss with Inno Setup on a
# windows-latest runner - Inno Setup is Windows-only. Publishes to a
# dedicated "storycore-installer" GitHub Release (not the service's own
# storycore-service-v<version> releases from service-build-windows.yml) -
# this installer's own source rarely changes, and its download link should
# stay the same regardless of which Core service build it happens to fetch
# at install time.
permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "installer/**"
      - ".github/workflows/installer-build.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile the StoryCore installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: installer/storycore-installer.iss

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: storycore-installer
          name: StoryCore — installer
          body: |
            Installs the Core service in the background: a Windows Startup
            shortcut, no admin rights, no configuration. Downloads the
            current Core service build at install time, so this release
            stays current without needing a new installer build for every
            service update - see storycore-service-v<version> releases for
            the service build itself.
          files: installer/output/StoryCore-Setup.exe
          fail_on_unmatched_files: true
